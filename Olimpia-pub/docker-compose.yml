version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: olimpiapub:latest
    networks:
      - olimpiapub

  web:
    image: nginx:alpine
    depends_on:
      - app
    ports:
      - '8080:80'
    volumes:
      - ./:/var/www/html:cached
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - olimpiapub

networks:
  olimpiapub:
    driver: bridge
