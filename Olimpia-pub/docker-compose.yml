version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: olimpiapub:latest
    networks:
      - olimpiapub

  web:
    image: nginx:alpine
    depends_on:
      - app
    ports:
      - '8080:80'
    volumes:
      - ./:/var/www/html:cached
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - olimpiapub

  sonarqube:
    image: sonarqube:lts-community
    container_name: olimpia_sonarqube
    ports:
      - "9000:9000"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    networks:
      - olimpiapub

networks:
  olimpiapub:
    driver: bridge

volumes:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
